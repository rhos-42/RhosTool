<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compte — RhosTool</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="index.html">RhosTool <span>compte</span></a>
      <nav class="nav">
        <a href="index.html">Accueil</a>
        <a href="downloads.html">Téléchargements</a>
        <a class="active" href="account.html">Compte</a>
      </nav>
    </header>

    <div class="card-form">
      <h1>Compte</h1>
      <p class="sub">Même authentification que l’application Windows.</p>

      <div class="tabs" role="tablist">
        <button type="button" class="active" data-tab="login">Connexion</button>
        <button type="button" data-tab="register">Inscription</button>
      </div>

      <form id="form-login">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="username" required />
        <label for="login-password">Mot de passe</label>
        <input id="login-password" type="password" autocomplete="current-password" required minlength="6" />
        <div class="actions" style="margin-top:1rem">
          <button class="btn btn-primary" type="submit">Connexion</button>
          <button class="btn" type="button" id="btn-recover">Mot de passe oublié</button>
        </div>
      </form>

      <form id="form-register" hidden>
        <label for="reg-username">Nom d’utilisateur</label>
        <input id="reg-username" type="text" autocomplete="nickname" />
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" autocomplete="email" required />
        <label for="reg-password">Mot de passe</label>
        <input id="reg-password" type="password" autocomplete="new-password" required minlength="6" />
        <div class="actions" style="margin-top:1rem">
          <button class="btn btn-primary" type="submit">Créer le compte</button>
        </div>
      </form>

      <p id="status" class="status" role="status"></p>

      <div id="profile" class="profile-box" hidden></div>
      <div class="actions" style="margin-top:0.75rem">
        <button class="btn" type="button" id="btn-logout" hidden>Déconnexion</button>
        <a class="btn" href="downloads.html">Téléchargements</a>
      </div>

      <p class="note" id="config-note" hidden>
        Ajoutez la clé anon dans <code>web/js/config.js</code>
        (voir <code>config.example.js</code> et docs/AUTH-SUPABASE.md).
      </p>
    </div>

    <footer class="footer">
      <span>Supabase Auth · table profiles</span>
      <a href="index.html">Retour</a>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const profileEl = document.getElementById("profile");
    const logoutBtn = document.getElementById("btn-logout");
    const formLogin = document.getElementById("form-login");
    const formRegister = document.getElementById("form-register");
    const configNote = document.getElementById("config-note");

    function setStatus(msg, kind) {
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function renderSession(session) {
      if (!session) {
        profileEl.hidden = true;
        logoutBtn.hidden = true;
        return;
      }
      profileEl.hidden = false;
      logoutBtn.hidden = false;
      profileEl.innerHTML =
        `<div><strong>Email</strong> ${session.email || "—"}</div>` +
        `<div><strong>User</strong> ${session.username || "—"}</div>` +
        `<div><strong>Credits</strong> ${Number(session.credits || 0).toFixed(2)}</div>`;
    }

    document.querySelectorAll(".tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tabs button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const tab = btn.dataset.tab;
        formLogin.hidden = tab !== "login";
        formRegister.hidden = tab !== "register";
        setStatus("");
      });
    });

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      setStatus("Connexion…", "warn");
      const result = await RhosAuth.login(
        document.getElementById("login-email").value,
        document.getElementById("login-password").value
      );
      setStatus(result.message, result.ok ? "ok" : "err");
      renderSession(result.session || null);
    });

    formRegister.addEventListener("submit", async (e) => {
      e.preventDefault();
      setStatus("Création…", "warn");
      const result = await RhosAuth.register(
        document.getElementById("reg-email").value,
        document.getElementById("reg-password").value,
        document.getElementById("reg-username").value
      );
      setStatus(result.message, result.ok ? "ok" : "err");
      renderSession(result.session || null);
    });

    document.getElementById("btn-recover").addEventListener("click", async () => {
      const email = document.getElementById("login-email").value;
      if (!email) {
        setStatus("Indiquez votre email.", "err");
        return;
      }
      setStatus("Envoi…", "warn");
      const result = await RhosAuth.recover(email);
      setStatus(result.message, result.ok ? "ok" : "err");
    });

    logoutBtn.addEventListener("click", () => {
      RhosAuth.logout();
      renderSession(null);
      setStatus("Déconnecté.", "warn");
    });

    (async function boot() {
      if (!RhosAuth.isConfigured()) {
        configNote.hidden = false;
        setStatus("Config Supabase incomplète.", "warn");
      }
      let session = RhosAuth.loadSession();
      if (session) {
        session = (await RhosAuth.refreshSession()) || session;
        if (session?.accessToken) {
          await RhosAuth.enrichProfile(session);
        }
      }
      renderSession(session);
    })();
  </script>
</body>
</html>
